<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下関市 高齢者福祉施設マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    color: #333;
  }
  header {
    height: 52px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    background-color: #ffffff;
    border-bottom: 1px solid #ddd;
    z-index: 10;
  }
  h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
  }
  #container {
    display: flex;
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #map {
    flex: 1;
    width: 100%;
    height: 100%;
  }

  /* 詳細情報パネル */
  #info-panel {
    background: #ffffff;
    box-shadow: 0 0 16px rgba(0,0,0,0.18);
    z-index: 1000;
    display: flex;
    flex-direction: column;
  }
  #info-panel.hidden {
    display: none;
  }
  .panel-header {
    padding: 12px 16px;
    background: #f4f6f8;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-title {
    font-size: 1rem;
    font-weight: bold;
    margin: 0;
    line-height: 1.4;
    word-break: break-all;
  }
  .close-btn {
    border: none;
    background: transparent;
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
    color: #777;
  }
  .panel-body {
    padding: 16px;
    overflow-y: auto;
    font-size: 0.9rem;
  }

  /* 属性テーブル */
  .prop-table {
    width: 100%;
    border-collapse: collapse;
    word-break: break-word;
  }
  .prop-table th, .prop-table td {
    padding: 10px 8px;
    border-bottom: 1px solid #eee;
    text-align: left;
    vertical-align: top;
  }
  .prop-table th {
    background-color: #fafafa;
    color: #666;
    font-weight: 600;
    width: 32%;
    white-space: nowrap;
  }
  .prop-table td {
    color: #222;
  }
  .tel-link {
    color: #0066cc;
    text-decoration: none;
    font-weight: 500;
  }
  .tel-link:hover {
    text-decoration: underline;
  }

  /* PC向け（右サイドパネル） */
  @media (min-width: 769px) {
    #info-panel {
      width: 380px;
      height: 100%;
      border-left: 1px solid #ccc;
    }
  }

  /* モバイル向け（ボトムシート） */
  @media (max-width: 768px) {
    #info-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 50%;
      border-top: 1px solid #ccc;
      border-radius: 12px 12px 0 0;
    }
  }
</style>
</head>
<body>

<header>
  <h1>下関市 高齢者福祉施設マップ</h1>
</header>

<div id="container">
  <div id="map"></div>
  <div id="info-panel" class="hidden">
    <div class="panel-header">
      <span class="panel-title" id="panel-title">施設詳細</span>
      <button class="close-btn" id="close-panel" aria-label="閉じる">&times;</button>
    </div>
    <div class="panel-body" id="panel-content"></div>
  </div>
</div>

<script>
// 1. タイルレイヤー
const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
});

const gsiStdLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
});

const gsiPhotoLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
  attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
});

// 2. 地図初期化（唐戸中心・下関全域表示）
const map = L.map('map', {
  center: [33.957, 130.946],
  zoom: 10,
  layers: [osmLayer]
});

// 3. レイヤー切り替えコントロール
const baseMaps = {
  "OpenStreetMap": osmLayer,
  "地理院地図 (標準)": gsiStdLayer,
  "地理院地図 (写真)": gsiPhotoLayer
};
L.control.layers(baseMaps).addTo(map);

// 4. パネルUI要素
const panel = document.getElementById('info-panel');
const panelTitle = document.getElementById('panel-title');
const panelContent = document.getElementById('panel-content');
const closeBtn = document.getElementById('close-panel');

closeBtn.addEventListener('click', () => {
  panel.classList.add('hidden');
});

// 5. HTMLエスケープ処理
function escapeHtml(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/[&<>'"]/g, tag => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    "'": '&#39;',
    '"': '&quot;'
  }[tag] || tag));
}

// 6. 属性値の最適化フォーマット
function formatFacilityValue(key, val) {
  if (val === null || val === undefined || val === '') return null; // 未定義・nullは除外判定用にnull返却

  // 電話番号の場合（市外局番083の補完とtelリンク化）
  if (key === '電話番号') {
    const rawTel = String(val).trim();
    // 複数番号併記（例: 227-2870/242-2021）対応
    const telNumbers = rawTel.split('/');
    return telNumbers.map(t => {
      const clean = t.trim();
      const dialNumber = clean.startsWith('0') ? clean : `083-${clean}`;
      return `<a href="tel:${dialNumber.replace(/-/g, '')}" class="tel-link">${escapeHtml(clean)}</a>`;
    }).join(' / ');
  }

  // 定員（人単位）
  if (key === '定員' && typeof val === 'number') {
    return `${val} 名`;
  }

  return escapeHtml(String(val));
}

// 7. GeoJSONの読み込みとプロパティ全展開
fetch('./mapdata.geojson')
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      onEachFeature: (feature, layer) => {
        layer.on('click', () => {
          const props = feature.properties || {};
          panelTitle.textContent = props.name || '名称未設定';

          const entries = Object.entries(props);
          let rows = '';

          for (const [key, value] of entries) {
            // タイトルに使用した name は重複するため表からはスキップ
            if (key === 'name') continue;

            const formatted = formatFacilityValue(key, value);
            // null（戸数がnullなど）の項目は表を圧迫しないよう除外
            if (formatted === null) continue;

            rows += `
              <tr>
                <th>${escapeHtml(key)}</th>
                <td>${formatted}</td>
              </tr>
            `;
          }

          if (rows === '') {
            panelContent.innerHTML = '<div style="color:#888;">登録情報がありません。</div>';
          } else {
            panelContent.innerHTML = `<table class="prop-table"><tbody>${rows}</tbody></table>`;
          }

          panel.classList.remove('hidden');
        });
      }
    }).addTo(map);
  })
  .catch(err => {
    console.error('GeoJSONデータの読み込みに失敗しました:', err);
  });
</script>
</body>
</html>
